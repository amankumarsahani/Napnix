  <!-- Analytics + Meta Pixel: one gtag.js load, both GA4 properties, deferred
       past first paint, and skipped for Playwright/localhost so the prerender
       does not log 51 pageviews. See SEO-HEAD-NOTES.md §4. -->
  <script>
    (function () {
      var GA4_IDS = ['G-C0JQD47CHK', 'G-XZZDQ3BX19'];
      var META_PIXEL_ID = '2073229720265884';

      var host = location.hostname;
      var isLocal = host === 'localhost' || host === '127.0.0.1' || host.endsWith('.local');
      if (navigator.webdriver || isLocal) return;

      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };

      function load() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA4_IDS[0];
        document.head.appendChild(s);

        window.gtag('js', new Date());
        GA4_IDS.forEach(function (id) { window.gtag('config', id); });

        /* Meta Pixel, unchanged except for when it runs. */
        !function (f, b, e, v, n, t, s2) {
          if (f.fbq) return; n = f.fbq = function () {
            n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments)
          };
          if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
          n.queue = []; t = b.createElement(e); t.async = !0;
          t.src = v; s2 = b.getElementsByTagName(e)[0];
          s2.parentNode.insertBefore(t, s2)
        }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
        window.fbq('init', META_PIXEL_ID);
        window.fbq('track', 'PageView');
      }

      function schedule() {
        if (window.requestIdleCallback) window.requestIdleCallback(load, { timeout: 3000 });
        else setTimeout(load, 1200);
      }

      if (document.readyState === 'complete') schedule();
      else window.addEventListener('load', schedule, { once: true });
    })();
  </script>

  <!-- Speculation Rules: prerender the paths GA4 shows people actually go to.
       /napcrm/pricing is the strongest commercial page on the site (6 of 64
       organic sessions, second only to the homepage). "moderate" eagerness
       fires on hover/pointerdown rather than eagerly, so this costs nothing
       for visitors who never head that way. Browsers without support ignore
       the block entirely. -->
  <script type="speculationrules">
  {
    "prerender": [{
      "where": { "href_matches": ["/napcrm", "/napcrm/pricing", "/contact"] },
      "eagerness": "moderate"
    }],
    "prefetch": [{
      "where": { "href_matches": ["/services", "/products", "/about", "/portfolio", "/faq"] },
      "eagerness": "moderate"
    }]
  }
  </script>

  <!-- Fonts are self-hosted. @font-face lives in src/fonts.css and is inlined
       with the rest of the CSS by scripts/prerender.mjs, so the first paint needs
       no third-party origin at all. The preconnects to fonts.googleapis.com and
       fonts.gstatic.com are gone with it. See src/fonts.css for the variable-font
       detail and the licence position. -->

  <!-- NO font preloads, deliberately.
       Preloading inter-var + outfit-var (79 KB) was measured at 4x CPU /
       1.6 Mbps as FCP 4520ms vs 4104ms without, and LCP 4564 vs 4152 — a
       416ms regression, because the fonts competed with the hero image for
       bandwidth during the critical window. font-display: swap means text
       paints immediately in the fallback face regardless, so the preload was
       buying a slightly earlier swap at the cost of the largest paint.
       If the hero image ever stops being the LCP element, re-measure before
       adding these back. -->

  <!-- Keep imagesrcset byte-identical to srcSet in src/components/Hero.jsx, or

  <!-- Inline Critical CSS for Loading State -->
  <style>
    /* Instant loading indicator - shows before JS loads */
    #root:empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #F8FAFC;
    }

    #root:empty::after {
      content: '';
      width: 48px;
      height: 48px;
      border: 3px solid rgba(37, 99, 235, 0.15);
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Prevent layout shift during font loading */
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
