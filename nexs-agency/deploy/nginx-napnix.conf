# nginx server block for napnix.in — the file that actually controls redirects,
# headers and 404s in production.
#
# Why this file exists: napnix.in is served by nginx on the VPS from
# /var/www/html/Napnix/nexs-agency/dist, with Cloudflare proxying in front.
# `public/_redirects` and `public/_headers` are Netlify / Cloudflare Pages
# conventions — **nginx does not read either one**. They ship into dist/ and do
# nothing, which is why the audit findings for origin redirects, security
# headers and real 404s all stayed open while the repo appeared to declare them.
# EDGE-CONFIG.md documented the drafted block; this promotes it to a
# version-controlled file so it can be diffed and reviewed like the rest.
#
# Apply with:
#   ssh -o ProxyCommand="cloudflared access ssh --hostname %h" admin@ssh.napnix.in
#   sudo cp nginx-napnix.conf /etc/nginx/sites-available/napnix.in
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify afterwards with the commands at the bottom of EDGE-CONFIG.md.

server {
    listen 443 ssl http2;
    server_name napnix.in;
    root /var/www/html/Napnix/nexs-agency/dist;
    index index.html;

    # --- Security headers -------------------------------------------------
    # Declared in public/_headers for months and never served, because nginx
    # does not read that file. `always` so they are sent on error responses too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # vite-plugin-compression2 and prerender.mjs both write .gz / .br siblings;
    # serve those rather than recompressing per request.
    gzip_static on;
    # brotli_static on;   # only if nginx was built with ngx_brotli

    # --- Legacy product names --------------------------------------------
    # These were client-side <Navigate> redirects, so they only fired once the
    # JS bundle ran — a crawler reading raw HTML got the shell on a 200 and
    # never followed them. As server 301s they work without JavaScript.
    location = /nexcrm         { return 301 https://napnix.in/napcrm; }
    location = /nexcrm/pricing { return 301 https://napnix.in/napcrm/pricing; }
    location ^~ /nexcrm/industries/ {
        rewrite ^/nexcrm/industries/(.*)$ https://napnix.in/napcrm/industries/$1 permanent;
    }
    location = /nexmail        { return 301 https://napnix.in/napmail; }

    # --- Hashed bundles ---------------------------------------------------
    # Immutable, and a missing one must 404 rather than fall through to HTML:
    # a client holding a stale chunk reference otherwise receives index.html and
    # fails to parse it as JavaScript.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html  { add_header Cache-Control "no-cache" always; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600" always; }

    # robots.txt and the AI-facing files change on deploy and are cached hard at
    # the Cloudflare edge (robots.txt was observed served from a 4-hour-old HIT
    # after a successful deploy, which reads exactly like a failed one). A short
    # TTL keeps them close to the deployed copy; purge the edge cache if a
    # change must be visible immediately.
    location ~ ^/(robots\.txt|llms\.txt|llms-full\.txt|license\.xml)$ {
        add_header Cache-Control "public, max-age=300" always;
    }

    # --- Routes whose content is fetched at runtime ------------------------
    # prerender.mjs writes a real directory for every route in the sitemap, so
    # almost everything is served from disk by `$uri/` below. These prefixes are
    # the exception: the blog carries generated slugs that only exist in the API,
    # and these utility routes are not prerendered. They must reach the SPA on a
    # 200, so a wrong slug under /blog/ also answers 200 — a narrow, deliberate
    # trade against 404ing real articles.
    #
    # /blog itself is NOT in this list: it prerenders now that the index renders
    # its curated guides from local data instead of waiting on the API.
    # /blog/ is split in two so the noindex below lands only on generated slugs.
    # A prerendered post (one of the five curated ones) is a real directory and
    # is served by $uri/ straight from disk. Anything else is a generated slug
    # and falls through to @blog_generated.
    location ^~ /blog/        { try_files $uri $uri/ @blog_generated; }

    # The 86 machine-generated posts, served noindex at the HTTP level.
    #
    # src/constants/blogIndexing.js already decided these should be
    # `noindex, follow`, and the reasoning there is sound: in 90 days they drew
    # 903 impressions for queries like "ai with emotions" and
    # "connectionism vs symbolism", none related to CRM or custom software, and
    # GSC shows ~90 such URLs holding about 61% of all site impressions. They
    # pull topical relevance away from the pages that sell.
    #
    # But that noindex was applied by react-helmet after the bundle ran. Two
    # consequences: Googlebot saw two conflicting robots tags and had to resolve
    # them by taking the most restrictive, and the AI crawlers robots.txt
    # explicitly invites — GPTBot, ClaudeBot, PerplexityBot, OAI-SearchBot — do
    # not execute JavaScript, so they received the SPA shell on a 200 with
    # `index, follow`. Eighty-six byte-identical copies of the homepage.
    #
    # An HTTP header needs no JavaScript and cannot conflict with itself.
    # `follow` is kept deliberately: these pages still pass link equity.
    location @blog_generated {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /index.html =404;
    }

    location ^~ /portfolio/   { try_files $uri $uri/ /index.html; }
    location ^~ /admin/       { try_files $uri $uri/ /index.html; }
    location = /thank-you     { try_files $uri $uri/ /index.html; }
    location = /data-deletion { try_files $uri $uri/ /index.html; }

    # --- Everything else --------------------------------------------------
    # Prerendered routes are real directories (dist/napcrm/index.html), which is
    # what `$uri/` serves, so it must precede the fallback. An unmatched path
    # now gets 404.html on a 404 instead of the 325 KB homepage on a 200 —
    # previously /ai.txt, /ai-catalog.json, /.well-known/ai-plugin.json and
    # every typo were soft 404s serving the full homepage.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}

# --- One canonical origin ------------------------------------------------
# All four origins answered 200 before this, so napnix.in, www.napnix.in and
# both http:// forms were four addressable copies of the same site.
server {
    listen 443 ssl http2;
    server_name www.napnix.in;
    return 301 https://napnix.in$request_uri;
}

server {
    listen 80;
    server_name napnix.in www.napnix.in;
    return 301 https://napnix.in$request_uri;
}
