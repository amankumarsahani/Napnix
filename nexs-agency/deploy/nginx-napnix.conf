# nginx site config for napnix.in — the file that actually controls redirects,
# headers and 404s in production.
#
# This REPLACES /etc/nginx/sites-available/default. Read the next section before
# applying it: the previous version of this file targeted a server that does not
# exist, and following its instructions would have been a no-op at best.
#
# ---------------------------------------------------------------------------
# What the server actually looks like (verified on the box, 2026-10-05)
# ---------------------------------------------------------------------------
#
#   nginx 1.26.3, listening on 0.0.0.0:80 ONLY. There is no :443 listener and
#   no certificate anywhere in /etc/nginx. Cloudflare terminates TLS and
#   proxies to port 80 over the tunnel.
#
#   Webroot:  /var/www/html/NexSpireSolutions/nexs-agency/dist
#   Checkout: /var/www/html/NexSpireSolutions   (git, tracks master)
#   Enabled:  /etc/nginx/sites-enabled/default -> sites-available/default
#             That symlink is the only thing in sites-enabled.
#
# Four things the earlier draft of this file got wrong, each of which would
# have caused a failure or a silent no-op:
#
#   1. It declared `listen 443 ssl http2`. There is no certificate on this
#      host, so `nginx -t` would have failed with "no ssl_certificate is
#      defined for the listen ... ssl directive".
#   2. Its root was /var/www/html/Napnix/nexs-agency/dist. That path does not
#      exist. Had the config loaded, every request would have 404ed.
#   3. Its server_name was napnix.in only, and it was to be written to
#      sites-available/napnix.in — which nothing symlinks into sites-enabled.
#      nginx would never have read it. `nginx -t` passes, reload succeeds,
#      nothing changes: the failure mode that makes a deploy look successful.
#   4. It dropped the api.nexspiresolutions.co.in proxy block, which lives in
#      the same file. Replacing the file without it would have taken that API
#      offline.
#
# Preserved deliberately from the config this replaces:
#   * `absolute_redirect off` — behind Cloudflare's TLS termination nginx would
#     otherwise emit an http:// Location on a directory redirect, downgrading
#     the visitor.
#   * `try_files $uri $uri/index.html` rather than `$uri/`. `$uri/` makes nginx
#     301 /napcrm to /napcrm/, which would not match the no-slash canonical the
#     prerender writes. Serving the index file directly keeps URL and canonical
#     identical.
#   * Both existing server blocks: the nexspiresolutions.co.in frontend (same
#     webroot) and the api.nexspiresolutions.co.in proxy to :5000.
#
# ---------------------------------------------------------------------------
# Applying it
# ---------------------------------------------------------------------------
#
#   ssh -o ProxyCommand="cloudflared access ssh --hostname %h" admin@ssh.napnix.in
#   sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak
#   sudo cp /var/www/html/NexSpireSolutions/nexs-agency/deploy/nginx-napnix.conf \
#           /etc/nginx/sites-available/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Roll back with:
#   sudo cp /etc/nginx/sites-available/default.bak /etc/nginx/sites-available/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ---------------------------------------------------------------------------
# What stays at Cloudflare, not here
# ---------------------------------------------------------------------------
#
#   http -> https is enforced below via $http_x_forwarded_proto, which is the
#   only signal nginx has behind the tunnel. Turning on "Always Use HTTPS" in
#   Cloudflare (SSL/TLS -> Edge Certificates) is better: it redirects at the
#   edge before the request ever reaches this box. Do both; they agree.
#
#   The nexspiresolutions.co.in -> napnix.in redirect is already a Cloudflare
#   rule and is intentionally not duplicated here.


# ---------------------------------------------------------------------------
# 0. Which blog slugs are legacy machine-generated posts
# ---------------------------------------------------------------------------
# This file is included from within `http`, so a map here is in the right
# context. It must stay outside the server blocks.
#
# The block below used to be unconditional: @blog_generated stamped
# `noindex, follow` on every /blog/ path that was not a prerendered directory
# on disk. Only the six curated posts are prerendered, so that caught the 86
# legacy posts and also every new post the AI pipeline would ever write --
# whatever its slug, however good the article. The generator's output could
# not be indexed by construction.
#
# The rule is now the same one the frontend applies in
# src/constants/blogIndexing.js: a slug is legacy when it is at least 46
# characters AND ends in a hyphen plus eight alphanumerics, the shape the old
# `Date.now().toString(36)` suffix produced. One regex expresses both halves:
# 37 characters, a hyphen, then exactly 8 -- 46 minimum.
#
# The two layers have to agree. If GENERATED_MIN_LENGTH moves in
# blogIndexing.js, or MAX_SLUG_LENGTH moves in
# nexs-backend/services/aiBlog.service.js, this regex moves too.
#
# nginx skips an add_header whose value is an empty string, which is what makes
# the default branch a no-op rather than an empty header.
#
# This mirrors isGeneratedSlug() in src/constants/blogIndexing.js, for the
# crawlers that do not run JavaScript. Like that function it is a safety net
# rather than the rule: the generated back catalogue is removed by
# nexs-backend/scripts/unpublish-ai-blogs.js, and an unpublished post 404s from
# the API and gets its noindex from BlogArticle's not-found branch.
#
# The pattern is 37 characters, a hyphen, then exactly 8 -- 46 minimum, which
# is GENERATED_MIN_LENGTH. The slug builder in
# nexs-backend/services/aiBlog.service.js caps at 45 so its output cannot
# match. Move one of those numbers and you must move all three.
# $request_uri, NOT $uri. This cost a silent failure once, so it is worth
# stating plainly: `try_files /app-shell.html` inside @blog_dynamic rewrites
# $uri to /app-shell.html, and add_header evaluates its value at header-filter
# time -- after that rewrite. Mapping on $uri therefore looked up
# "/app-shell.html", fell to the default, produced an empty string, and nginx
# skipped the header entirely. The config parsed, the reload succeeded, and no
# generated slug was ever marked noindex. Verified against nginx 1.26-alpine:
# with $uri the header is absent, with $request_uri it is present.
#
# $request_uri is the untouched request line, so it survives try_files. It also
# carries any query string, hence the (?:\?|$) -- /blog/<slug>?utm_source=x has
# to match too, or a shared link escapes the rule.
map $request_uri $blog_legacy_robots {
    default                                             "";
    "~^/blog/[a-z0-9-]{37,}-[a-z0-9]{8}/?(?:\?|$)"     "noindex, follow";
}


# ---------------------------------------------------------------------------
# 1. www -> apex
# ---------------------------------------------------------------------------
# All four origin forms answered 200 before this, so napnix.in, www.napnix.in
# and both http:// forms were four addressable copies of one site.
server {
    listen 80;
    server_name www.napnix.in;
    absolute_redirect off;
    return 301 https://napnix.in$request_uri;
}

# ---------------------------------------------------------------------------
# 2. Main site — napnix.in (and nexspiresolutions.co.in, same build)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name napnix.in nexspiresolutions.co.in;

    root /var/www/html/NexSpireSolutions/nexs-agency/dist;
    index index.html;

    absolute_redirect off;

    # Behind the Cloudflare tunnel this header is the only way to know the
    # visitor's scheme. $scheme is always "http" here, so testing it would
    # redirect forever.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # --- Security headers -------------------------------------------------
    # Declared in public/_headers for months and never served: that file is a
    # Netlify / Cloudflare Pages convention and nginx does not read it.
    # `always` so they are sent on error responses too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Licensing terms, declared the standard way. This replaced a
    # `License: https://napnix.in/license.xml` line in robots.txt, which is not
    # part of the robots.txt grammar — an unknown directive there makes the
    # whole file fail validation, and Lighthouse's robots-txt audit was marking
    # it invalid. index.html also carries <link rel="license">.
    add_header Link "</license.xml>; rel=\"license\"" always;

    # vite-plugin-compression2 and prerender.mjs write .gz siblings; serve those
    # instead of recompressing per request. This nginx is built
    # --with-http_gzip_static_module. It has no brotli module, so .br files on
    # disk are ignored here and Cloudflare handles brotli at the edge.
    gzip_static on;

    # --- Legacy product names --------------------------------------------
    # These were client-side <Navigate> redirects, so they only fired once the
    # JS bundle ran; a crawler reading raw HTML got the shell on a 200 and
    # never followed them. As server 301s they work without JavaScript.
    location = /nexcrm         { return 301 https://napnix.in/napcrm; }
    location = /nexcrm/pricing { return 301 https://napnix.in/napcrm/pricing; }
    location ^~ /nexcrm/industries/ {
        rewrite ^/nexcrm/industries/(.*)$ https://napnix.in/napcrm/industries/$1 permanent;
    }
    location = /nexmail        { return 301 https://napnix.in/napmail; }

    # --- Renamed author ----------------------------------------------------
    # /authors/kshitij-bhardwaj was live, in the sitemap, and had been pushed to
    # IndexNow before the byline was reassigned to Anu Kumar. Without this it
    # would 404 for anything that had already picked it up.
    location = /authors/kshitij-bhardwaj { return 301 https://napnix.in/authors/anu-kumar; }

    # --- Hashed bundles ---------------------------------------------------
    # Immutable, and a missing one must 404 rather than fall through to HTML:
    # a client holding a stale chunk reference otherwise receives index.html and
    # fails to parse it as JavaScript.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html  { add_header Cache-Control "no-cache" always; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600" always; }

    # robots.txt and the AI-facing files change on deploy and are cached hard at
    # the Cloudflare edge (robots.txt was observed served from a 4-hour-old HIT
    # after a successful deploy, which reads exactly like a failed one). A short
    # TTL keeps them close to the deployed copy; purge the edge cache if a
    # change must be visible immediately.
    location ~ ^/(robots\.txt|llms\.txt|llms-full\.txt|license\.xml)$ {
        add_header Cache-Control "public, max-age=300" always;
    }

    # --- Markdown siblings -------------------------------------------------
    # scripts/prerender.mjs writes a .md next to every prerendered route. nginx
    # has no mime type for .md, so without this it would be served as
    # application/octet-stream and browsers would download it rather than
    # display it. charset matters because the content carries ₹ and en dashes.
    #
    # This is content negotiation's poor cousin: a client that sends
    # `Accept: text/markdown` for /napcrm/pricing still gets HTML, because
    # mapping that to the .md file needs a map{} block in the http context,
    # which lives in nginx.conf rather than this server block. The .md URLs are
    # discoverable via <link rel="alternate" type="text/markdown"> on every
    # page, which is how the agent-readiness audit looks for them.
    location ~ \.md$ {
        types { } default_type "text/markdown; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # --- Blog -------------------------------------------------------------
    # Split in two so the noindex below lands only on generated slugs. A
    # curated post is a real directory and is served straight from disk by
    # $uri/index.html. Anything else falls through to @blog_dynamic.
    location ^~ /blog/ {
        # A nested regex block, because the outer `location ~ \.md$` above can
        # never match a path under /blog/. `^~` wins against regex locations by
        # design, so /blog/<slug>.md was being served by this block with no mime
        # type -- it arrived as application/octet-stream and browsers downloaded
        # it instead of displaying it. Nesting the regex inside the prefix match
        # is what gets the Markdown siblings under /blog/ the right type.
        location ~ \.md$ {
            types { } default_type "text/markdown; charset=utf-8";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=300" always;
            try_files $uri =404;
        }

        try_files $uri $uri/index.html @blog_dynamic;
    }

    # Every blog post whose content comes from the API, legacy or new.
    #
    # The 86 legacy machine-generated posts are served noindex here. The
    # reasoning in src/constants/blogIndexing.js is sound: in 90 days they drew
    # 903 impressions for queries like "ai with emotions" and
    # "connectionism vs symbolism", none related to CRM or custom software, and
    # GSC shows ~90 such URLs holding about 61% of all site impressions. They
    # pull topical relevance away from the pages that sell.
    #
    # But that noindex was applied by react-helmet after the bundle ran. Two
    # consequences: Googlebot saw two conflicting robots tags and had to resolve
    # them by taking the most restrictive, and the AI crawlers robots.txt
    # explicitly invites — GPTBot, ClaudeBot, PerplexityBot, OAI-SearchBot — do
    # not execute JavaScript, so they received the SPA shell on a 200 with
    # `index, follow`. Eighty-six byte-identical copies of the homepage.
    #
    # An HTTP header needs no JavaScript and cannot conflict with itself.
    # `follow` is kept deliberately: these pages still pass link equity.
    #
    # What changed: the header is now driven by $blog_legacy_robots (see section
    # 0) instead of being unconditional, so a new post with a clean slug is no
    # longer noindexed just for being API-driven. It is still not prerendered,
    # so a non-JS crawler sees the shell either way — making generated posts
    # citable needs prerendering, which is a separate piece of work.
    location @blog_dynamic {
        add_header X-Robots-Tag $blog_legacy_robots always;

        # The five security headers have to be repeated here. nginx's add_header
        # is not additive across levels: as soon as a location declares one of
        # its own, the inherited set is dropped entirely. This block declares
        # X-Robots-Tag, so without the repetition these responses shipped with
        # no HSTS, no nosniff and no frame protection.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # app-shell.html, not index.html. index.html IS the prerendered homepage,
        # so serving it here gave all 86 generated slugs the homepage's canonical
        # (https://napnix.in/) and `robots: index, follow` -- the latter directly
        # contradicting the noindex header above. The shell asserts neither, and
        # react-helmet sets the right values once the bundle runs.
        try_files /app-shell.html =404;
    }

    # --- Routes whose content is fetched at runtime ------------------------
    # prerender.mjs writes a real directory for all 51 sitemap routes, so almost
    # everything is served from disk by the rule below. These are the
    # exceptions: /portfolio/:slug beyond the three case studies, and utility
    # routes that are deliberately not prerendered. They must reach the SPA on a
    # 200.
    location ^~ /portfolio/   { try_files $uri $uri/index.html /app-shell.html; }
    location ^~ /admin/       { try_files $uri $uri/index.html /app-shell.html; }
    location = /thank-you     { try_files $uri $uri/index.html /app-shell.html; }
    location = /data-deletion { try_files $uri $uri/index.html /app-shell.html; }

    # --- Everything else --------------------------------------------------
    # An unmatched path now gets 404.html with a 404 status instead of the
    # ~290 KB prerendered homepage on a 200. Previously /ai.txt,
    # /.well-known/ai-catalog.json, /sitemap_index.xml, /assets/missing-abc.js
    # and every typo were soft 404s serving the full homepage — which is also
    # the single cause of the failing Lighthouse `ard-schema` audit.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;

        # Same add_header inheritance trap as @blog_dynamic: this block sets
        # Cache-Control, so the five inherited security headers were dropped and
        # every 404 was served without them.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}

# ---------------------------------------------------------------------------
# 3. Backend API — preserved from the config this replaces
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.nexspiresolutions.co.in;
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
