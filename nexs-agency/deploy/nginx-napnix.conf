# nginx site config for napnix.in — the file that actually controls redirects,
# headers and 404s in production.
#
# This REPLACES /etc/nginx/sites-available/default. Read the next section before
# applying it: the previous version of this file targeted a server that does not
# exist, and following its instructions would have been a no-op at best.
#
# ---------------------------------------------------------------------------
# What the server actually looks like (verified on the box, 2026-10-05)
# ---------------------------------------------------------------------------
#
#   nginx 1.26.3, listening on 0.0.0.0:80 ONLY. There is no :443 listener and
#   no certificate anywhere in /etc/nginx. Cloudflare terminates TLS and
#   proxies to port 80 over the tunnel.
#
#   Webroot:  /var/www/html/NexSpireSolutions/nexs-agency/dist
#   Checkout: /var/www/html/NexSpireSolutions   (git, tracks master)
#   Enabled:  /etc/nginx/sites-enabled/default -> sites-available/default
#             That symlink is the only thing in sites-enabled.
#
# Four things the earlier draft of this file got wrong, each of which would
# have caused a failure or a silent no-op:
#
#   1. It declared `listen 443 ssl http2`. There is no certificate on this
#      host, so `nginx -t` would have failed with "no ssl_certificate is
#      defined for the listen ... ssl directive".
#   2. Its root was /var/www/html/Napnix/nexs-agency/dist. That path does not
#      exist. Had the config loaded, every request would have 404ed.
#   3. Its server_name was napnix.in only, and it was to be written to
#      sites-available/napnix.in — which nothing symlinks into sites-enabled.
#      nginx would never have read it. `nginx -t` passes, reload succeeds,
#      nothing changes: the failure mode that makes a deploy look successful.
#   4. It dropped the api.nexspiresolutions.co.in proxy block, which lives in
#      the same file. Replacing the file without it would have taken that API
#      offline.
#
# Preserved deliberately from the config this replaces:
#   * `absolute_redirect off` — behind Cloudflare's TLS termination nginx would
#     otherwise emit an http:// Location on a directory redirect, downgrading
#     the visitor.
#   * `try_files $uri $uri/index.html` rather than `$uri/`. `$uri/` makes nginx
#     301 /napcrm to /napcrm/, which would not match the no-slash canonical the
#     prerender writes. Serving the index file directly keeps URL and canonical
#     identical.
#   * Both existing server blocks: the nexspiresolutions.co.in frontend (same
#     webroot) and the api.nexspiresolutions.co.in proxy to :5000.
#
# ---------------------------------------------------------------------------
# Applying it
# ---------------------------------------------------------------------------
#
#   ssh -o ProxyCommand="cloudflared access ssh --hostname %h" admin@ssh.napnix.in
#   sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak
#   sudo cp /var/www/html/NexSpireSolutions/nexs-agency/deploy/nginx-napnix.conf \
#           /etc/nginx/sites-available/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Roll back with:
#   sudo cp /etc/nginx/sites-available/default.bak /etc/nginx/sites-available/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ---------------------------------------------------------------------------
# What stays at Cloudflare, not here
# ---------------------------------------------------------------------------
#
#   http -> https is enforced below via $http_x_forwarded_proto, which is the
#   only signal nginx has behind the tunnel. Turning on "Always Use HTTPS" in
#   Cloudflare (SSL/TLS -> Edge Certificates) is better: it redirects at the
#   edge before the request ever reaches this box. Do both; they agree.
#
#   The nexspiresolutions.co.in -> napnix.in redirect is already a Cloudflare
#   rule and is intentionally not duplicated here.


# ---------------------------------------------------------------------------
# 1. www -> apex
# ---------------------------------------------------------------------------
# All four origin forms answered 200 before this, so napnix.in, www.napnix.in
# and both http:// forms were four addressable copies of one site.
server {
    listen 80;
    server_name www.napnix.in;
    absolute_redirect off;
    return 301 https://napnix.in$request_uri;
}

# ---------------------------------------------------------------------------
# 2. Main site — napnix.in (and nexspiresolutions.co.in, same build)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name napnix.in nexspiresolutions.co.in;

    root /var/www/html/NexSpireSolutions/nexs-agency/dist;
    index index.html;

    absolute_redirect off;

    # Behind the Cloudflare tunnel this header is the only way to know the
    # visitor's scheme. $scheme is always "http" here, so testing it would
    # redirect forever.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # --- Security headers -------------------------------------------------
    # Declared in public/_headers for months and never served: that file is a
    # Netlify / Cloudflare Pages convention and nginx does not read it.
    # `always` so they are sent on error responses too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # vite-plugin-compression2 and prerender.mjs write .gz siblings; serve those
    # instead of recompressing per request. This nginx is built
    # --with-http_gzip_static_module. It has no brotli module, so .br files on
    # disk are ignored here and Cloudflare handles brotli at the edge.
    gzip_static on;

    # --- Legacy product names --------------------------------------------
    # These were client-side <Navigate> redirects, so they only fired once the
    # JS bundle ran; a crawler reading raw HTML got the shell on a 200 and
    # never followed them. As server 301s they work without JavaScript.
    location = /nexcrm         { return 301 https://napnix.in/napcrm; }
    location = /nexcrm/pricing { return 301 https://napnix.in/napcrm/pricing; }
    location ^~ /nexcrm/industries/ {
        rewrite ^/nexcrm/industries/(.*)$ https://napnix.in/napcrm/industries/$1 permanent;
    }
    location = /nexmail        { return 301 https://napnix.in/napmail; }

    # --- Hashed bundles ---------------------------------------------------
    # Immutable, and a missing one must 404 rather than fall through to HTML:
    # a client holding a stale chunk reference otherwise receives index.html and
    # fails to parse it as JavaScript.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html  { add_header Cache-Control "no-cache" always; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600" always; }

    # robots.txt and the AI-facing files change on deploy and are cached hard at
    # the Cloudflare edge (robots.txt was observed served from a 4-hour-old HIT
    # after a successful deploy, which reads exactly like a failed one). A short
    # TTL keeps them close to the deployed copy; purge the edge cache if a
    # change must be visible immediately.
    location ~ ^/(robots\.txt|llms\.txt|llms-full\.txt|license\.xml)$ {
        add_header Cache-Control "public, max-age=300" always;
    }

    # --- Blog -------------------------------------------------------------
    # Split in two so the noindex below lands only on generated slugs. A
    # curated post is a real directory and is served straight from disk by
    # $uri/index.html. Anything else falls through to @blog_generated.
    location ^~ /blog/ {
        try_files $uri $uri/index.html @blog_generated;
    }

    # The 86 machine-generated posts, served noindex at the HTTP level.
    #
    # src/constants/blogIndexing.js already decided these should be
    # `noindex, follow`, and the reasoning there is sound: in 90 days they drew
    # 903 impressions for queries like "ai with emotions" and
    # "connectionism vs symbolism", none related to CRM or custom software, and
    # GSC shows ~90 such URLs holding about 61% of all site impressions. They
    # pull topical relevance away from the pages that sell.
    #
    # But that noindex was applied by react-helmet after the bundle ran. Two
    # consequences: Googlebot saw two conflicting robots tags and had to resolve
    # them by taking the most restrictive, and the AI crawlers robots.txt
    # explicitly invites — GPTBot, ClaudeBot, PerplexityBot, OAI-SearchBot — do
    # not execute JavaScript, so they received the SPA shell on a 200 with
    # `index, follow`. Eighty-six byte-identical copies of the homepage.
    #
    # An HTTP header needs no JavaScript and cannot conflict with itself.
    # `follow` is kept deliberately: these pages still pass link equity.
    location @blog_generated {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /index.html =404;
    }

    # --- Routes whose content is fetched at runtime ------------------------
    # prerender.mjs writes a real directory for all 51 sitemap routes, so almost
    # everything is served from disk by the rule below. These are the
    # exceptions: /portfolio/:slug beyond the three case studies, and utility
    # routes that are deliberately not prerendered. They must reach the SPA on a
    # 200.
    location ^~ /portfolio/   { try_files $uri $uri/index.html /index.html; }
    location ^~ /admin/       { try_files $uri $uri/index.html /index.html; }
    location = /thank-you     { try_files $uri $uri/index.html /index.html; }
    location = /data-deletion { try_files $uri $uri/index.html /index.html; }

    # --- Everything else --------------------------------------------------
    # An unmatched path now gets 404.html with a 404 status instead of the
    # ~290 KB prerendered homepage on a 200. Previously /ai.txt,
    # /.well-known/ai-catalog.json, /sitemap_index.xml, /assets/missing-abc.js
    # and every typo were soft 404s serving the full homepage — which is also
    # the single cause of the failing Lighthouse `ard-schema` audit.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}

# ---------------------------------------------------------------------------
# 3. Backend API — preserved from the config this replaces
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.nexspiresolutions.co.in;
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
